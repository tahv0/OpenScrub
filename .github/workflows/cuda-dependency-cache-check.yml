name: CUDA dependency-stage cache contract

on:
  pull_request:
    paths:
      - Dockerfile.cuda
      - compose.windows-cuda.yml
      - scripts/build-windows-cuda.ps1
      - docs/DOCKER_BUILD_CACHE.md
      - tests/test_cuda_dependency_image.py
      - tests/test_windows_cuda_builder.ps1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate CUDA Dockerfile without downloading PyTorch
        run: |
          set -euo pipefail
          docker buildx build --call=targets -f Dockerfile.cuda . | tee /tmp/openscrub-cuda-targets
          grep -q cuda_deps /tmp/openscrub-cuda-targets
          grep -q app /tmp/openscrub-cuda-targets
          docker buildx build --call=check -f Dockerfile.cuda .
      - name: Verify persistent dependency-image invariants
        run: python3 -m unittest discover -s tests -p test_cuda_dependency_image.py -v
      - name: Confirm Windows CUDA Compose defaults to the retained local image
        shell: bash
        run: |
          set -euo pipefail
          env -u OPENSCRUB_CUDA_DEPS_IMAGE \
            OPENSCRUB_TEST_MEDIA_DIR=/tmp \
            OPENSCRUB_TEST_DATA_DIR=/tmp \
            docker compose -f compose.windows-test.yml -f compose.windows-cuda.yml config --format json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); a=d["services"]["openscrub"]["build"]["args"]; assert a["OPENSCRUB_CUDA_DEPS_IMAGE"] == "openscrub-cuda-deps:local", a; assert str(a["OPENSCRUB_ENABLE_TRAINING"]) == "1", a'
      - name: Parse Windows PowerShell wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/build-windows-cuda.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - name: Parse Docker Desktop PowerShell mock test
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'tests/test_windows_cuda_builder.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - name: Mock Docker Desktop context selection (no CUDA downloads)
        shell: pwsh
        run: ./tests/test_windows_cuda_builder.ps1
