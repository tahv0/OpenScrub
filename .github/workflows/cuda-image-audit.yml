name: CUDA image audit and shared-layer architecture

on:
  pull_request:
    paths:
      - 'docker/audit_cuda_image.py'
      - 'docker/cuda-shared-layers.json'
      - 'scripts/audit-windows-cuda.ps1'
      - 'tests/test_cuda_image_audit.py'
      - 'docs/CUDA_SHARED_LAYER_ARCHITECTURE.md'
      - '.github/workflows/cuda-image-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Read-only CUDA audit and stage topology regression tests
        run: python3 -m unittest discover -s tests -p test_cuda_image_audit.py -v
      - name: Ensure architecture manifest is parseable JSON
        run: python3 -m json.tool docker/cuda-shared-layers.json > /dev/null
      - name: Check the Windows audit helper parses cleanly
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'scripts/audit-windows-cuda.ps1', [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }
      - name: Verify no image installation is required for the audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--network' scripts/audit-windows-cuda.ps1
          grep -q -- '--read-only' scripts/audit-windows-cuda.ps1
          if grep -E 'docker[[:space:]]+(build|system[[:space:]]+prune|image[[:space:]]+rm)' scripts/audit-windows-cuda.ps1; then
            echo 'Audit helper must not build, remove or prune images'
            exit 1
          fi
