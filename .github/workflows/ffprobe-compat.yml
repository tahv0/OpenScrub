name: FFprobe source compatibility

on:
  pull_request:
    paths:
      - 'openscrub.py'
      - 'openscrub_internal/exact_samples.py'
      - 'openscrub_internal/checkpoint_media.py'
      - 'tests/test_ffprobe_compat.py'
      - '.github/workflows/ffprobe-compat.yml'
  push:
    branches: ['integration/current-work']
    paths:
      - 'openscrub.py'
      - 'openscrub_internal/exact_samples.py'
      - 'openscrub_internal/checkpoint_media.py'
      - 'tests/test_ffprobe_compat.py'
      - '.github/workflows/ffprobe-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probes:
    name: Source probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install distribution FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p "$RUNNER_TEMP/openscrub-ffmpeg"
          ln -s /usr/bin/ffmpeg "$RUNNER_TEMP/openscrub-ffmpeg/ffmpeg"
          ln -s /usr/bin/ffprobe "$RUNNER_TEMP/openscrub-ffmpeg/ffprobe"
          echo "$RUNNER_TEMP/openscrub-ffmpeg" >> "$GITHUB_PATH"
      - name: Install test dependencies
        run: python -m pip install pytest numpy 'opencv-python-headless<5'
      - name: Verify source probes against distribution FFprobe
        run: |
          ffprobe -version
          python -m pytest tests/test_ffprobe_compat.py -q
