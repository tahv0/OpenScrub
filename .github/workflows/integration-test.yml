name: Combined PR Docker and browser smoke test

on:
  push:
    branches: ['integration/all-prs']
  pull_request:
    branches: ['integration/all-prs']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENSCRUB_TEST_MEDIA_DIR: /tmp/openscrub-integration-media
      OPENSCRUB_TEST_DATA_DIR: /tmp/openscrub-integration-data
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OPENSCRUB_NO_AUTOFETCH: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install synthetic fixture and browser tooling
        run: |
          python -m pip install -e . playwright pytest
          python -m playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
      - name: Prepare isolated bind mounts and synthetic fixture
        run: |
          mkdir -p "$OPENSCRUB_TEST_MEDIA_DIR" "$OPENSCRUB_TEST_DATA_DIR"
          python tools/integration_smoke.py --prepare
          docker compose version
          docker compose -f compose.windows-test.yml config --quiet
          docker compose -f compose.windows-test.yml -f compose.windows-cuda.yml config --quiet
          docker compose -f compose.windows-test.yml -f compose.windows-cuda.yml -f compose.windows-training.yml config --quiet
      - name: Fail early on Python syntax, module packaging and Docker COPY
        run: |
          python -m py_compile openscrub.py openscrub_web.py stop_review.py
          python -c "import openscrub_web, stop_review; assert callable(openscrub_web.job_detections)"
          python -c "from pathlib import Path; assert all('COPY openscrub.py openscrub_web.py stop_review.py' in Path(name).read_text() for name in ('Dockerfile','Dockerfile.cuda')), 'stop_review.py missing from Docker COPY'"
          python -m pytest -q test_stop_review.py
      - name: Build the combined source image
        run: docker compose -f compose.windows-test.yml build
      - name: Start the actual Compose service
        run: docker compose -f compose.windows-test.yml up -d --wait --wait-timeout 180
      - name: Verify installed app and mounted paths
        run: |
          docker compose -f compose.windows-test.yml exec -T -w / openscrub python -c "import openscrub_web as w; assert w.JOBS_DIR.startswith('/root/.local/share/OpenScrub/'); print(w.JOBS_DIR)"
          python tools/integration_smoke.py --verify
      - name: Verify MP4 job survives container recreation
        run: |
          docker compose -f compose.windows-test.yml down
          docker compose -f compose.windows-test.yml up -d --wait --wait-timeout 180
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          url = 'http://localhost:8384/api/jobs/integration-fixture'
          job = json.load(urlopen(url))
          assert job['phase'] == 'done' and job['has_output'], job
          report = json.load(urlopen(url + '/report'))
          expected = json.loads(Path('integration-evidence/updated_corners_audit.json').read_text())
          assert report == expected, 'Restart changed the saved review report'
          video = urlopen(url + '/download').read()
          assert video == Path('integration-evidence/updated_corners.mp4').read_bytes(), 'Restart changed the rendered video'
          print('Current rendered video and corrected review recovered unchanged from bind-mounted data')
          PY
      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p integration-evidence
          docker compose -f compose.windows-test.yml ps > integration-evidence/compose-ps.txt
          docker compose -f compose.windows-test.yml logs --no-color > integration-evidence/compose.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: combined-pr-docker-browser-evidence
          path: integration-evidence/
          retention-days: 30
      - name: Stop disposable test container
        if: always()
        run: docker compose -f compose.windows-test.yml down
