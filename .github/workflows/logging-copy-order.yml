name: Verify logging Docker COPY order
on:
  push:
    branches: [fix/runtime-logging-copy-order]
    paths: [.github/workflows/logging-copy-order.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Preserve existing COPY order and logging module
        run: |
          python - <<'PY'
          from pathlib import Path
          old='COPY openscrub.py openscrub_web.py openscrub_logging.py stop_review.py'
          new='COPY openscrub.py openscrub_web.py stop_review.py openscrub_logging.py'
          for name in ('Dockerfile','Dockerfile.cuda','Dockerfile.intel'):
              path=Path(name)
              text=path.read_text()
              assert text.count(old)==1,name
              path.write_text(text.replace(old,new))
              assert 'COPY openscrub.py openscrub_web.py stop_review.py' in path.read_text()
              assert 'openscrub_logging.py' in path.read_text()
          PY
          git diff --check
          git config user.name 'OpenScrub logging verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Dockerfile Dockerfile.cuda Dockerfile.intel
          git commit -m 'Preserve Docker packaging guard while including logging module'
          git push origin HEAD:fix/runtime-logging-copy-order
