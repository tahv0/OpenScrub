name: OCR onset diagnostic
on:
  push:
    branches: [test/qa-onset-diagnostic]
    paths: [.github/workflows/ocr-diagnostic.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    env:
      OPENSCRUB_NO_AUTOFETCH: '1'
      REVIEW_EVIDENCE_DIR: /tmp/reliability-evidence
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install original full-suite environment
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
          python -m pip install 'numpy<2' 'opencv-python-headless<5' onnx onnxruntime pytest pytest-timeout flask cheroot rapidfuzz pytesseract pillow pyyaml cryptography playwright build hatchling
          python -m playwright install --with-deps chromium
          python -m pip freeze > /tmp/ocr-environment.txt
          lscpu >> /tmp/ocr-environment.txt
          tesseract --version >> /tmp/ocr-environment.txt 2>&1
      - name: Original full invocation without instrumentation or deselection
        run: |
          set -o pipefail
          python -m compileall -q openscrub.py openscrub_web.py learning_session.py video_learning.py test_review_soak.py
          python -c 'import openscrub_web;open("/tmp/reliability-app.js","w").write(openscrub_web.APP_JS)'
          node --check /tmp/reliability-app.js
          python -m pytest -q --timeout=60 --durations=25 --junitxml=/tmp/reliability-full.xml 2>&1 | tee /tmp/reliability-full.txt
      - name: Repeat extended tests independently of unrelated full-suite failures
        if: always()
        run: |
          set -o pipefail
          python -m pytest -q test_review_soak.py --timeout=60 --durations=15 --junitxml=/tmp/reliability-repeat.xml 2>&1 | tee /tmp/reliability-repeat.txt
      - name: Inspect fixture after tests without altering detector behavior
        if: always()
        run: |
          python - <<'PY' 2>&1 | tee /tmp/ocr-actual-frames.txt
          import glob,cv2,pytesseract,openscrub,json,hashlib
          for path in glob.glob('/tmp/pytest-of-*/pytest-*/test_deep_backtrack_finds_true0/late.mp4'):
              print('VIDEO',path,'CV',cv2.__version__,'TESS',pytesseract.get_tesseract_version())
              cap=cv2.VideoCapture(path)
              for index in (90,120,150):
                  cap.set(cv2.CAP_PROP_POS_FRAMES,index);ok,image=cap.read()
                  print('FRAME',index,ok)
                  if not ok:continue
                  print('HASH',hashlib.sha256(image.tobytes()).hexdigest())
                  raw=pytesseract.image_to_data(cv2.cvtColor(image,cv2.COLOR_BGR2GRAY),output_type=pytesseract.Output.DICT)
                  print('RAW',json.dumps([(t,c) for t,c in zip(raw['text'],raw['conf']) if t.strip()]))
                  words=openscrub.TesseractBackend().read(image)
                  print('WORDS',words)
                  print('FOUND',[(d.category,d.text) for d in openscrub.detect_phi(words,openscrub.group_lines(words),4,(0,0),None,None)])
              cap.release()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controlled-repeat-${{ matrix.python-version }}
          path: |
            /tmp/reliability-full.*
            /tmp/reliability-repeat.*
            /tmp/reliability-evidence/
            /tmp/ocr-environment.txt
            /tmp/ocr-actual-frames.txt
            /tmp/pytest-of-runner/pytest-0/test_deep_backtrack_finds_true0/
          retention-days: 7
