name: OCR onset diagnostic
on:
  push:
    branches: [test/qa-onset-diagnostic]
    paths: [.github/workflows/ocr-diagnostic.yml]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENSCRUB_NO_AUTOFETCH: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install diagnostic dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
          python -m pip install 'numpy<2' 'opencv-python-headless<5' pytest pytest-timeout flask rapidfuzz pytesseract pillow pyyaml cryptography
      - name: Run instrumented regression without changing detector decisions
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/ocr-diagnostic.txt
          import json, cv2, numpy as np, openscrub, pytest, pytesseract
          print('VERSIONS',cv2.__version__,np.__version__,pytesseract.get_tesseract_version())
          read=openscrub.TesseractBackend.read
          def observed(self,frame):
              raw=self.pt.image_to_data(cv2.cvtColor(frame,cv2.COLOR_BGR2GRAY),output_type=self.pt.Output.DICT)
              print('RAW',json.dumps([(t,c) for t,c in zip(raw['text'],raw['conf']) if t.strip()]))
              result=read(self,frame)
              print('WORDS',repr(result))
              return result
          openscrub.TesseractBackend.read=observed
          class Trace(openscrub.Callbacks):
              def log(self,message): print('PIPELINE',message)
          pipeline=openscrub.run_pipeline
          openscrub.run_pipeline=lambda args,callbacks: pipeline(args,Trace())
          raise SystemExit(pytest.main(['-q','-s','test_openscrub.py::test_deep_backtrack_finds_true_onset','--basetemp=/tmp/onset-fixture']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ocr-onset-diagnostic
          path: |
            /tmp/ocr-diagnostic.txt
            /tmp/onset-fixture/**/*.json
          retention-days: 3
