name: Save persistence workbench
on:
  push:
    branches: [fix/review-save-persistence-and-http-snapshots]
    paths: [.github/workflows/save-persistence-workbench.yml, tools/apply_save_persistence.py]
permissions:
  contents: write
concurrency:
  group: save-persistence-workbench
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENSCRUB_NO_AUTOFETCH: '1'
      OPENSCRUB_CPU_DNN: '1'
      REVIEW_EVIDENCE_DIR: /tmp/save-persistence-evidence
    steps:
      - uses: actions/checkout@v4
      - name: Detect staged patch
        id: patch
        run: |
          if test -f tools/apply_save_persistence.py; then echo 'present=true' >> "$GITHUB_OUTPUT"; fi
      - name: Apply exact-source checksum-verified patch
        if: steps.patch.outputs.present == 'true'
        run: python tools/apply_save_persistence.py
      - uses: actions/setup-python@v5
        if: steps.patch.outputs.present == 'true'
        with:
          python-version: '3.10'
      - name: Install CPU browser and production HTTP server test environment
        if: steps.patch.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg tesseract-ocr
          python -m pip install 'numpy<2' opencv-python-headless==4.11.0.86 onnxruntime==1.20.1 onnx pytest pytest-timeout flask rapidfuzz pyyaml cryptography playwright build hatchling cheroot==11.1.2 pytesseract pillow
          python -m playwright install --with-deps chromium
      - name: Syntax and actual Cheroot browser persistence regressions
        if: steps.patch.outputs.present == 'true'
        run: |
          set -o pipefail
          python -m py_compile openscrub_web.py test_save_persistence.py
          python -c 'import openscrub_web;open("/tmp/save-app.js","w").write(openscrub_web.APP_JS)'
          node --check /tmp/save-app.js
          python -m pytest -q test_save_persistence.py test_release_reliability.py test_review_browser.py test_learning_browser.py --timeout=90 --junitxml=/tmp/save-browser.xml | tee /tmp/save-browser.txt
      - name: Existing learning and review backend regressions
        if: steps.patch.outputs.present == 'true'
        run: |
          set -o pipefail
          python -m pytest -q test_plate_quad.py test_plate_quad_editor.py test_plate_quad_autosave.py test_review_performance.py test_stop_review.py test_plate_seg_training.py test_learning_session.py test_video_learning.py test_learning_packaging.py --timeout=60 --junitxml=/tmp/save-unit.xml | tee /tmp/save-unit.txt
      - name: Publish tested application source to isolated branch
        if: steps.patch.outputs.present == 'true'
        run: |
          git diff --check
          git config user.name 'OpenScrub persistence verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openscrub_web.py test_save_persistence.py docs/superpowers/plans/2026-11-08-review-persistence.md
          git add -u tools/
          git commit -m 'Persist review decisions despite corner errors and serve immutable HTTP snapshots'
          git push origin HEAD:fix/review-save-persistence-and-http-snapshots
      - name: Audit full suite without hiding known baseline failures
        if: steps.patch.outputs.present == 'true'
        run: |
          set -o pipefail
          python -m pytest -q -ra --timeout=60 --junitxml=/tmp/save-full.xml | tee /tmp/save-full.txt
      - uses: actions/upload-artifact@v4
        if: always() && steps.patch.outputs.present == 'true'
        with:
          name: save-persistence-validation
          path: |
            /tmp/save-*.txt
            /tmp/save-*.xml
            /tmp/save-persistence-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
