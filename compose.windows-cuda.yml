# Add to compose.windows-test.yml to build this branch with NVIDIA CUDA.
# Keep both -f arguments on subsequent build/up/run commands.
services:
  openscrub:
    build:
      dockerfile: Dockerfile.cuda
      # Keep the training variant consistent across 'build' and 'up --build'.
      # An unset ARG previously reverted to 0 on 'up --build' and could
      # evict the much larger training=1 build cache.
      args:
        OPENSCRUB_ENABLE_TRAINING: "${OPENSCRUB_ENABLE_TRAINING:-1}"
        # Use the RETAINED local dependency image by default on Windows.
        # Formerly this fell back to "cuda_deps" on every new terminal, so
        # a plain Compose build could silently run apt/pip/torch all over
        # again (including ~700 MB cuDNN). First run the checked-in wrapper
        # to create openscrub-cuda-deps:local; missing images fail instead
        # of unexpectedly downloading the whole training environment.
        # Official release builds use Dockerfile.cuda directly and are
        # unaffected by this Windows-only Compose default.
        OPENSCRUB_CUDA_DEPS_IMAGE: "${OPENSCRUB_CUDA_DEPS_IMAGE:-openscrub-cuda-deps:local}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
