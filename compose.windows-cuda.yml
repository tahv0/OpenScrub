# Add to compose.windows-test.yml to build this branch with NVIDIA CUDA.
# Keep both -f arguments on subsequent build/up/run commands.
services:
  openscrub:
    # The fast Windows helper tags the final application image explicitly.
    # Compose 'up --no-build' runs this exact local tag without invoking
    # Compose's builder-selection path again. Manual Compose builds use it too.
    image: openscrub-windows-test-openscrub:local
    build:
      dockerfile: Dockerfile.cuda
      # Keep the training variant consistent across 'build' and 'up --build'.
      # An unset ARG previously reverted to 0 on 'up --build' and could
      # evict the much larger training=1 build cache.
      args:
        OPENSCRUB_ENABLE_TRAINING: "${OPENSCRUB_ENABLE_TRAINING:-1}"
        # Default builds the Dockerfile's dependency stage normally.
        # scripts/build-windows-cuda.ps1 selects a tagged local dependency
        # image, which survives Docker Desktop's build-cache garbage collector.
        OPENSCRUB_CUDA_DEPS_IMAGE: "${OPENSCRUB_CUDA_DEPS_IMAGE:-cuda_deps}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
