# Optional local training, layered over windows-test + windows-cuda.
# Reuse the same data/media mounts. No GPU or Docker socket exposed to HTTP.
services:
  openscrub:
    # Bounded private IPC headroom; not GPU VRAM or a disk reservation.
    # Web training and standalone validation still use workers=0.
    shm_size: "1gb"
    build:
      args:
        OPENSCRUB_ENABLE_TRAINING: "1"
    environment:
      OPENSCRUB_TRAIN_PYTHON: /opt/openscrub-training/bin/python
      OPENSCRUB_TRAIN_WEIGHTS: /root/.local/share/OpenScrub/training/yolo11n-seg.pt
      YOLO_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: /root/.local/share/OpenScrub/training/ultralytics
